name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@v7

      - name: Checkout app schema
        uses: actions/checkout@v7
        with:
          repository: Open-Sikh-Apps/gurbani-paath-player
          path: app

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Fill missing byteSize
        run: npx tsx scripts/fill-catalogue-bytesize.ts ../catalogue.json
        working-directory: app

      - run: npx tsx scripts/validate-catalogue.ts ../catalogue.json ../catalogue.version.json
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-json
          path: catalogue.json

      - name: Commit filled byteSize
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json
          if git diff --staged --quiet; then
            echo "No byteSize changes"
          else
            git commit -m "Fill missing track byteSize from object HEAD."
            git push
          fi

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: catalogue-json
          path: .
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=gurbani-paath-player-catalogue
